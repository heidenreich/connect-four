<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect Four</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: one phone-width column — scoreboard, board, controls — sized to fit one screen */
:root {
  --bg: #eaeef7;
  --surface: #ffffff;
  --fg: #172036;
  --muted: #5a6582;
  --line: #d3d9e8;
  --board: #2350d6;
  --board-edge: #183c9f;
  --hole: #dfe5f2;
  --p1: #e5484d;
  --p1-deep: #b52f34;
  --p2: #f5b800;
  --p2-deep: #c48f00;
  --focus: #2350d6;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1322; --surface: #172036; --fg: #edf1fb; --muted: #9aa6c4; --line: #27324d;
    --board: #2a5be8; --board-edge: #1a3c9e; --hole: #0a1020; --focus: #8fb0ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1322; --surface: #172036; --fg: #edf1fb; --muted: #9aa6c4; --line: #27324d;
  --board: #2a5be8; --board-edge: #1a3c9e; --hole: #0a1020; --focus: #8fb0ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 520px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.75rem;
  letter-spacing: -0.01em;
  margin: 0;
  line-height: 1;
  display: flex; align-items: center; gap: 8px;
}
h1 .mini { display: inline-flex; gap: 3px; }
h1 .mini i { width: 12px; height: 12px; border-radius: 50%; display: block; }
h1 .mini i:nth-child(odd) { background: var(--p1); }
h1 .mini i:nth-child(even) { background: var(--p2); }
.hint { margin: 0; color: var(--muted); font-size: 0.875rem; }

/* Opponent and level pickers */
.setup { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; }
.seg button {
  appearance: none; border: 0; margin: 0;
  background: transparent; color: var(--muted);
  font: 700 0.875rem var(--font-body);
  min-height: 36px; padding: 6px 12px;
  border-radius: 9px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.player input[readonly] { cursor: default; border-bottom-color: transparent; }

/* Scoreboard */
.scores { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; }
.player {
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto auto;
  column-gap: 10px;
  align-items: center;
  min-width: 0;
  transition: border-color .2s, box-shadow .2s;
}
.player.active { border-color: var(--pc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc) 25%, transparent); }
.player[data-p="1"] { --pc: var(--p1); --pd: var(--p1-deep); }
.player[data-p="2"] { --pc: var(--p2); --pd: var(--p2-deep); }
.chip {
  grid-row: 1 / span 2;
  width: 30px; height: 30px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--pc) 60%, white) 0 18%, var(--pc) 45%, var(--pd) 100%);
}
.player input {
  font: 600 0.95rem var(--font-body);
  color: var(--fg);
  background: transparent;
  border: 0;
  border-bottom: 1px dashed transparent;
  padding: 0;
  width: 100%;
  min-width: 0;
}
.player input:hover { border-bottom-color: var(--line); }
.player input:focus { outline: none; border-bottom-color: var(--focus); }
.wins { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.wins small { font-family: var(--font-body); font-size: 0.7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: 4px; }
.draws { align-self: center; text-align: center; color: var(--muted); font-size: 0.7rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.draws b { display: block; font-family: var(--font-display); font-size: 1.1rem; color: var(--fg); letter-spacing: 0; font-variant-numeric: tabular-nums; }

/* Status */
.status {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 44px;
  font-family: var(--font-display); font-weight: 600; font-size: 1.25rem;
  text-align: center; text-wrap: balance;
}
.status .chip { width: 22px; height: 22px; flex: none; }
.status[data-p="1"] { --pc: var(--p1); --pd: var(--p1-deep); }
.status[data-p="2"] { --pc: var(--p2); --pd: var(--p2-deep); }
.status[data-p="0"] .chip { display: none; }

/* Board */
.board-frame {
  background: var(--board);
  border-radius: 18px;
  padding: 3%;
  box-shadow: 0 6px 0 var(--board-edge), 0 14px 30px -12px rgba(10, 25, 80, .5);
}
.board {
  position: relative;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 7 / 6;
  border-radius: 8px;
  overflow: hidden;
  background: var(--hole);
}
.discs, .holes, .cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); }
.discs { grid-template-rows: repeat(6, 1fr); }
.holes {
  pointer-events: none;
  background-image: radial-gradient(circle closest-side, transparent 80%, rgba(0,0,0,.18) 81%, var(--board) 87%);
  background-size: calc(100% / 7) calc(100% / 6);
}
.disc { --c: transparent; --d: transparent; position: relative; }
.disc.p1 { --c: var(--p1); --d: var(--p1-deep); }
.disc.p2 { --c: var(--p2); --d: var(--p2-deep); }
.disc.p1, .disc.p2 {
  background: radial-gradient(circle closest-side,
    color-mix(in srgb, var(--c) 92%, white) 0 52%,
    var(--d) 55% 60%,
    var(--c) 63% 82%,
    transparent 84%);
}
.disc.dropping { animation: drop calc(140ms + var(--fall) * 55ms) cubic-bezier(.45, 0, 1, 1) both, settle 180ms ease-out calc(140ms + var(--fall) * 55ms); }
@keyframes drop { from { transform: translateY(calc(var(--fall) * -100%)); } to { transform: translateY(0); } }
@keyframes settle { 0% { transform: translateY(0); } 40% { transform: translateY(-9%); } 100% { transform: translateY(0); } }
.disc.win::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle closest-side, transparent 30%, #fff 33% 41%, transparent 44%);
  animation: pulse 1.1s ease-in-out infinite alternate;
}
@keyframes pulse { from { opacity: .55; } to { opacity: 1; } }
.board.over .disc:not(.win) { opacity: .45; transition: opacity .4s .3s; }

.cols button {
  appearance: none; border: 0; margin: 0; padding: 0;
  background: transparent;
  cursor: pointer;
  position: relative;
}
.cols button:disabled { cursor: default; }
.cols button:focus-visible { outline: 3px solid #fff; outline-offset: -3px; border-radius: 6px; }
@media (hover: hover) {
  .cols button:not(:disabled):hover { background: rgba(255, 255, 255, .10); }
}

/* Ghost disc above the board shows whose turn it is and which column */
.aim { display: grid; grid-template-columns: repeat(7, 1fr); padding-inline: 3%; height: 0; margin-bottom: -6px; }
.aim span { aspect-ratio: 1; transform: translateY(-100%); opacity: 0; transition: opacity .12s; }
.aim span.on { opacity: .9; background: radial-gradient(circle closest-side, var(--pc) 0 62%, transparent 66%); }
.aim[data-p="1"] { --pc: var(--p1); }
.aim[data-p="2"] { --pc: var(--p2); }
.board-zone { padding-top: calc((100% - 6%) / 7 * 0.7); position: relative; }
.board-zone .aim { position: absolute; top: calc((100% - 6%) / 7 * 0.7); left: 0; right: 0; }

/* Controls */
.controls { display: flex; gap: 10px; }
.controls button {
  flex: 1;
  font: 700 1rem var(--font-body);
  min-height: 48px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  cursor: pointer;
}
.controls button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.controls button:disabled { opacity: .45; cursor: default; }
.controls button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.foot { margin: 0; text-align: center; color: var(--muted); font-size: 0.8rem; }
.reset-scores { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; padding: 4px; }
.reset-scores.confirm { color: var(--p1-deep); font-weight: 700; }

@media (max-width: 360px) {
  .scores { grid-template-columns: 1fr 1fr; }
  .draws { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) {
  .disc.dropping, .disc.win::after { animation: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1><span class="mini" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Connect Four</h1>
    <p class="hint" id="hint">Tap a column. Pass the phone.</p>
  </header>

  <section class="setup" aria-label="Game setup">
    <div class="seg" role="group" aria-label="Opponent">
      <button type="button" data-mode="pvp">Friend</button>
      <button type="button" data-mode="cpu">Computer</button>
    </div>
    <div class="seg" role="group" aria-label="Computer level" id="levels">
      <button type="button" data-level="easy">Easy</button>
      <button type="button" data-level="medium">Medium</button>
      <button type="button" data-level="hard">Hard</button>
    </div>
  </section>

  <section class="scores" aria-label="Scoreboard">
    <div class="player" data-p="1" id="card1">
      <span class="chip" aria-hidden="true"></span>
      <input id="name1" maxlength="14" aria-label="Red player's name" autocomplete="off">
      <div class="wins"><span id="wins1">0</span><small>wins</small></div>
    </div>
    <div class="draws">Draws<b id="draws">0</b></div>
    <div class="player" data-p="2" id="card2">
      <span class="chip" aria-hidden="true"></span>
      <input id="name2" maxlength="14" aria-label="Yellow player's name" autocomplete="off">
      <div class="wins"><span id="wins2">0</span><small>wins</small></div>
    </div>
  </section>

  <div class="status" id="status" data-p="1" aria-live="polite"><span class="chip" aria-hidden="true"></span><span id="statusText"></span></div>

  <div class="board-zone">
    <div class="aim" id="aim" aria-hidden="true"></div>
    <div class="board-frame">
      <div class="board" id="board">
        <div class="discs" id="discs"></div>
        <div class="holes"></div>
        <div class="cols" id="cols"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="undo" type="button">Undo move</button>
    <button id="newGame" type="button" class="primary">New game</button>
  </div>
  <p class="foot">Whoever didn't start goes first next game. <button class="reset-scores" id="resetScores" type="button">Reset scores</button></p>
</div>

<script>
(() => {
  const COLS = 7, ROWS = 6, CELLS = COLS * ROWS;
  const KEY = "connect-four-v1";
  const ORDER = [3, 2, 4, 1, 5, 0, 6]; // try the middle first
  const DEPTH = { medium: 4, hard: 7 };
  const $ = id => document.getElementById(id);

  let S, cpuTimer = null, thinking = false;
  const fresh = () => ({
    board: Array(CELLS).fill(0),
    moves: [],
    starter: 1,
    turn: 1,
    winner: 0,      // 0 = playing, 1/2 = winner, 3 = draw
    winCells: [],
    scores: [0, 0, 0], // p1 wins, p2 wins, draws (two players)
    names: ["Red", "Yellow"],
    mode: "pvp",    // "pvp" or "cpu"; the computer plays yellow
    level: "medium",
    cpuScores: { easy: [0, 0, 0], medium: [0, 0, 0], hard: [0, 0, 0] },
  });

  function load(seed) {
    if (seed && seed.board) return seed;
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      if (saved && Array.isArray(saved.board) && saved.board.length === CELLS) {
        const base = fresh();
        const s = { ...base, ...saved, cpuScores: { ...base.cpuScores, ...(saved.cpuScores || {}) } };
        if (!["easy", "medium", "hard"].includes(s.level)) s.level = base.level;
        const filled = s.board.filter(Boolean).length;
        if (!Array.isArray(s.moves) || s.moves.length !== filled) Object.assign(s, { board: base.board, moves: [], winner: 0, winCells: [], turn: s.starter });
        return s;
      }
    } catch (e) {}
    return fresh();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  const vsCpu = () => S.mode === "cpu";
  const isCpuTurn = () => vsCpu() && !S.winner && S.turn === 2;
  const tally = () => vsCpu() ? S.cpuScores[S.level] : S.scores;

  // Board rules, on any board array
  function lowest(b, c) {
    for (let r = ROWS - 1; r >= 0; r--) if (!b[r * COLS + c]) return r;
    return -1;
  }
  function lineThrough(b, r, c, p) {
    const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (const [dr, dc] of dirs) {
      const cells = [[r, c]];
      for (const s of [1, -1]) {
        let rr = r + dr * s, cc = c + dc * s;
        while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && b[rr * COLS + cc] === p) {
          cells.push([rr, cc]); rr += dr * s; cc += dc * s;
        }
      }
      if (cells.length >= 4) return cells.map(([a, k]) => a * COLS + k);
    }
    return null;
  }
  function winsWith(b, c, p) {
    const r = lowest(b, c);
    if (r < 0) return false;
    const i = r * COLS + c;
    b[i] = p;
    const w = !!lineThrough(b, r, c, p);
    b[i] = 0;
    return w;
  }

  // Computer player: minimax with alpha-beta pruning (negamax form)
  const WIN = 1e6;
  function evaluate(b, p) {
    const o = 3 - p;
    let s = 0;
    for (let r = 0; r < ROWS; r++) {
      const v = b[r * COLS + 3];
      if (v === p) s += 3; else if (v === o) s -= 3;
    }
    const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) for (const [dr, dc] of dirs) {
      const er = r + 3 * dr, ec = c + 3 * dc;
      if (er < 0 || er >= ROWS || ec < 0 || ec >= COLS) continue;
      let mine = 0, theirs = 0;
      for (let k = 0; k < 4; k++) {
        const v = b[(r + k * dr) * COLS + c + k * dc];
        if (v === p) mine++; else if (v === o) theirs++;
      }
      if (mine && theirs) continue;
      if (mine === 3) s += 5; else if (mine === 2) s += 2;
      else if (theirs === 3) s -= 4; else if (theirs === 2) s -= 2;
    }
    return s;
  }
  function negamax(b, depth, alpha, beta, p, filled) {
    if (filled === CELLS) return 0;
    for (const c of ORDER) if (winsWith(b, c, p)) return WIN + depth;
    if (depth === 0) return evaluate(b, p);
    let best = -Infinity;
    for (const c of ORDER) {
      const r = lowest(b, c);
      if (r < 0) continue;
      const i = r * COLS + c;
      b[i] = p;
      const v = -negamax(b, depth - 1, -beta, -alpha, 3 - p, filled + 1);
      b[i] = 0;
      if (v > best) best = v;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }
  function bestMove(b, p, depth) {
    const filled = b.filter(Boolean).length;
    let best = -Infinity, pick = -1;
    for (const c of ORDER) {
      const r = lowest(b, c);
      if (r < 0) continue;
      if (winsWith(b, c, p)) return c;
      const i = r * COLS + c;
      b[i] = p;
      const v = -negamax(b, depth - 1, -Infinity, -best, 3 - p, filled + 1);
      b[i] = 0;
      if (v > best || pick < 0) { best = v; pick = c; }
    }
    return pick;
  }
  function easyMove(b, p) {
    const open = ORDER.filter(c => lowest(b, c) >= 0);
    for (const c of open) if (winsWith(b, c, p)) return c;
    if (Math.random() < 0.5) for (const c of open) if (winsWith(b, c, 3 - p)) return c;
    const weights = open.map(c => 4 - Math.abs(3 - c));
    let roll = Math.random() * weights.reduce((a, w) => a + w, 0);
    for (let k = 0; k < open.length; k++) if ((roll -= weights[k]) < 0) return open[k];
    return open[0];
  }
  function cpuPick() {
    const b = S.board.slice();
    return S.level === "easy" ? easyMove(b, 2) : bestMove(b, 2, DEPTH[S.level]);
  }

  function scheduleCpu() {
    clearTimeout(cpuTimer);
    thinking = isCpuTurn();
    if (!thinking) return;
    cpuTimer = setTimeout(() => {
      const c = cpuPick();
      thinking = false;
      play(c);
    }, 650);
  }

  const discEls = [], colEls = [], aimEls = [];
  function build() {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const d = document.createElement("div");
      d.className = "disc";
      d.addEventListener("animationend", e => { if (e.animationName === "settle") d.classList.remove("dropping"); });
      $("discs").appendChild(d);
      discEls.push(d);
    }
    for (let c = 0; c < COLS; c++) {
      const b = document.createElement("button");
      b.type = "button";
      b.addEventListener("click", () => humanDrop(c));
      b.addEventListener("pointerenter", () => aimAt(c));
      b.addEventListener("focus", () => aimAt(c));
      b.addEventListener("pointerleave", () => aimAt(-1));
      b.addEventListener("blur", () => aimAt(-1));
      $("cols").appendChild(b);
      colEls.push(b);
      const s = document.createElement("span");
      $("aim").appendChild(s);
      aimEls.push(s);
    }
  }

  function aimAt(c) {
    aimEls.forEach((s, i) => s.classList.toggle("on", i === c && !S.winner && !isCpuTurn() && S.board[c] === 0));
  }

  function humanDrop(c) {
    if (isCpuTurn()) return;
    play(c);
  }

  function play(c) {
    if (S.winner) return;
    const r = lowest(S.board, c);
    if (r < 0) return;
    const i = r * COLS + c, p = S.turn;
    S.board[i] = p;
    S.moves.push(i);
    const win = lineThrough(S.board, r, c, p);
    if (win) { S.winner = p; S.winCells = win; tally()[p - 1]++; }
    else if (S.moves.length === CELLS) { S.winner = 3; tally()[2]++; }
    else S.turn = 3 - p;
    save();
    scheduleCpu();
    render(i, r + 1);
    if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
  }

  // Against the computer, undo takes back your last move and its reply
  const canUndo = () => vsCpu() ? S.moves.some(i => S.board[i] === 1) : S.moves.length > 0;
  function undoOne() {
    const i = S.moves.pop();
    const p = S.board[i];
    S.board[i] = 0;
    const k = S.winner === 3 ? 2 : S.winner - 1;
    if (S.winner && tally()[k] > 0) tally()[k]--;
    S.winner = 0; S.winCells = [];
    S.turn = p;
  }
  function undo() {
    if (!canUndo()) return;
    undoOne();
    if (vsCpu()) while (S.moves.length && S.turn === 2) undoOne();
    save();
    scheduleCpu();
    render();
  }

  function clearBoard() {
    if (S.winner) S.starter = 3 - S.starter;
    S.board = Array(CELLS).fill(0);
    S.moves = []; S.winner = 0; S.winCells = [];
    S.turn = S.starter;
  }
  function newGame() {
    clearBoard();
    save();
    scheduleCpu();
    render();
  }
  function setMode(m) {
    if (m === S.mode) return;
    S.mode = m;
    clearBoard();
    save();
    scheduleCpu();
    render();
  }
  function setLevel(l) {
    if (l === S.level) return;
    S.level = l;
    if (vsCpu()) clearBoard();
    save();
    scheduleCpu();
    render();
  }

  const nameOf = p => vsCpu() && p === 2 ? "Computer" : (S.names[p - 1] || "").trim() || (p === 1 ? "Red" : "Yellow");

  function statusText() {
    if (S.winner === 3) return "Board's full. It's a draw.";
    if (vsCpu()) {
      if (S.winner === 1) return "You beat the computer!";
      if (S.winner === 2) return "The computer wins.";
      return S.turn === 1 ? "Your turn" : "Computer is thinking…";
    }
    if (S.winner) return `${nameOf(S.winner)} wins!`;
    return `${nameOf(S.turn)}'s turn`;
  }

  function render(dropped = -1, fall = 0) {
    S.board.forEach((v, i) => {
      const d = discEls[i];
      d.classList.toggle("p1", v === 1);
      d.classList.toggle("p2", v === 2);
      d.classList.toggle("win", S.winCells.includes(i));
      if (i === dropped) {
        d.classList.remove("dropping");
        void d.offsetWidth;
        d.style.setProperty("--fall", fall);
        d.classList.add("dropping");
      }
    });
    $("board").classList.toggle("over", S.winner === 1 || S.winner === 2);
    colEls.forEach((b, c) => {
      const full = S.board[c] !== 0;
      b.disabled = !!S.winner || full || thinking;
      b.setAttribute("aria-label", `Column ${c + 1}${full ? ", full" : ""}`);
    });
    const st = $("status");
    st.dataset.p = S.winner === 3 ? "0" : (S.winner || S.turn);
    $("statusText").textContent = statusText();
    $("aim").dataset.p = S.turn;
    $("card1").classList.toggle("active", !S.winner && S.turn === 1);
    $("card2").classList.toggle("active", !S.winner && S.turn === 2);
    const t = tally();
    $("wins1").textContent = t[0];
    $("wins2").textContent = t[1];
    $("draws").textContent = t[2];
    if (document.activeElement !== $("name1")) $("name1").value = S.names[0];
    const n2 = $("name2");
    n2.readOnly = vsCpu();
    if (vsCpu()) n2.value = "Computer";
    else if (document.activeElement !== n2) n2.value = S.names[1];
    n2.setAttribute("aria-label", vsCpu() ? "Computer opponent" : "Yellow player's name");
    $("hint").textContent = vsCpu() ? "You're red. Tap a column." : "Tap a column. Pass the phone.";
    document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
    document.querySelectorAll("[data-level]").forEach(b => b.setAttribute("aria-pressed", b.dataset.level === S.level));
    $("levels").hidden = !vsCpu();
    $("undo").disabled = !canUndo();
    $("newGame").textContent = S.winner ? "Play again" : "New game";
    aimAt(-1);
  }

  let resetArmed = null;
  function resetScores() {
    const b = $("resetScores");
    if (!resetArmed) {
      b.textContent = "Tap again to reset";
      b.classList.add("confirm");
      resetArmed = setTimeout(() => { resetArmed = null; b.textContent = "Reset scores"; b.classList.remove("confirm"); }, 3000);
      return;
    }
    clearTimeout(resetArmed); resetArmed = null;
    b.textContent = "Reset scores"; b.classList.remove("confirm");
    tally().fill(0);
    save(); render();
  }

  function start(data) {
    S = load(data && data.state);
    build();
    [1, 2].forEach(p => {
      const el = $("name" + p);
      el.addEventListener("input", () => { if (el.readOnly) return; S.names[p - 1] = el.value; save(); render(); });
      el.addEventListener("blur", () => { if (el.readOnly) return; if (!el.value.trim()) { S.names[p - 1] = p === 1 ? "Red" : "Yellow"; save(); render(); } });
      el.addEventListener("keydown", e => { if (e.key === "Enter") el.blur(); });
    });
    document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
    document.querySelectorAll("[data-level]").forEach(b => b.addEventListener("click", () => setLevel(b.dataset.level)));
    $("undo").addEventListener("click", undo);
    $("newGame").addEventListener("click", newGame);
    $("resetScores").addEventListener("click", resetScores);
    document.addEventListener("keydown", e => {
      if (e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 7) humanDrop(n - 1);
    });
    scheduleCpu();
    render();
    window.claude?.hot?.snapshot?.(() => ({ state: S }));
  }

  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
